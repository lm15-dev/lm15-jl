name: Julia

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native:
    name: Julia ${{ matrix.julia }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        julia: ['1.10', '1.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - name: Resolve for this Julia version and run tests
        shell: julia --color=yes --project=. {0}
        run: |
          using Pkg
          # The development manifest was resolved on Julia 1.12. Resolve
          # independently here so it does not pin another version's stdlibs.
          rm("Manifest.toml"; force=true)
          Pkg.instantiate()
          Pkg.test()

  scientific:
    name: Scientific package integrations / Julia 1.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - name: Install optional scientific dependencies
        working-directory: examples/scientific
        shell: julia --color=yes --project=. {0}
        run: |
          using Pkg
          Pkg.develop(path="../..")
          Pkg.instantiate()
      - name: Run local scientific workflows (no provider calls)
        working-directory: examples/scientific
        run: julia --startup-file=no --project=. runtests.jl
